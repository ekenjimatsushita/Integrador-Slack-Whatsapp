_metadata:
  major_version: 1
  minor_version: 1

display_information:
  name: Lion WhatsApp Integration
  description: Integra Slack ao laboratório WhatsApp mock da equipe.
  background_color: "#4A154B"

features:
  bot_user:
    display_name: Lion-WhatsApp-Lab
    always_online: false

oauth_config:
  scopes:
    bot:
      - channels:history
      - chat:write

settings:
  event_subscriptions:
    bot_events:
      - message.channels
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
